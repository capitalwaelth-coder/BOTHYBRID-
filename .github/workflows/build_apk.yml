name: Build HYBRID PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: false

      - name: Find Flutter project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "pubspec.yaml" ] && [ -f "lib/main.dart" ]; then
            PROJECT_DIR="."
          else
            while IFS= read -r file; do
              candidate="${file%/pubspec.yaml}"
              if [ -f "$candidate/lib/main.dart" ]; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(
              find . \
                -name pubspec.yaml \
                -not -path '*/.dart_tool/*' \
                -not -path '*/build/*' \
                -not -path '*/.pub-cache/*' \
                | sort
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Validate Android project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/build.gradle -o \
               -f android/app/build.gradle.kts
          test -f android/settings.gradle -o \
               -f android/settings.gradle.kts
          test -f android/gradlew

          echo "Android and Flutter project files verified."

      - name: Setup Gradle wrapper permissions
        run: |
          cd "$PROJECT_DIR"
          chmod +x android/gradlew

      - name: Clean previous build
        run: |
          cd "$PROJECT_DIR"
          flutter clean
          rm -rf .dart_tool build

      - name: Get Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Check Flutter code
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-pub

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HYBRID-PRO-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
