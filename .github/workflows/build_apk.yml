name: HYBRID PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Find Flutter project
        shell: bash
        run: |
          set -e
          PROJECT_DIR=""

          if [ -f "pubspec.yaml" ] && [ -f "lib/main.dart" ]; then
            PROJECT_DIR="."
          else
            while IFS= read -r file; do
              candidate="${file%/pubspec.yaml}"
              if [ -f "$candidate/lib/main.dart" ]; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(
              find . -name pubspec.yaml \
                -not -path '*/.dart_tool/*' \
                -not -path '*/build/*' \
                -not -path '*/.pub-cache/*' \
                | sort
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Cannot find Flutter project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Flutter project: $PROJECT_DIR"

      - name: Validate Flutter files
        run: |
          set -e
          cd "$PROJECT_DIR"
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "Flutter project files verified."

      - name: Generate Android platform if missing
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            flutter create . --platforms=android
          fi

          test -d android

      - name: Clean old build
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter clean
          rm -rf .dart_tool build

      - name: Ensure Gradle Wrapper
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            flutter create . --platforms=android
          fi

          if [ ! -f "$WRAPPER" ] || [ ! -f android/gradlew ]; then
            echo "ERROR: Gradle wrapper is missing."
            find android -maxdepth 5 -type f
            exit 1
          fi

          sed -i -E \
            's#gradle-[0-9][^/]*-(all|bin)\.zip#gradle-8.14.3-\1.zip#' \
            "$WRAPPER"

          chmod +x android/gradlew

          echo "Gradle wrapper:"
          cat "$WRAPPER"

          cd android
          ./gradlew --version

      - name: Update Android Gradle Plugin
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          python3 <<'PY'
          import re
          from pathlib import Path

          settings = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
          ]

          found = False

          for path in settings:
              if not path.is_file():
                  continue

              text = path.read_text()

              pattern = re.compile(
                  r'(id\s*\(?\s*["\']com\.android\.application["\']'
                  r'\s*\)?\s+version\s+["\'])[^"\']+(["\'])'
              )

              updated, count = pattern.subn(
                  lambda m: m.group(1) + "8.11.1" + m.group(2),
                  text
              )

              if count:
                  path.write_text(updated)
                  print(f"Updated AGP in {path}")
                  found = True

          if not found:
              path = Path("android/build.gradle")
              if path.is_file():
                  text = path.read_text()
                  updated, count = re.subn(
                      r'(com\.android\.tools\.build:gradle:)'
                      r'[0-9.]+',
                      r'\g<1>8.11.1',
                      text
                  )
                  if count:
                      path.write_text(updated)
                      print("Updated AGP in android/build.gradle")
                      found = True

          if not found:
              print("ERROR: Could not find Android Gradle Plugin declaration.")
              raise SystemExit(1)
          PY

          echo "AGP configuration:"
          grep -n -E 'com.android.application|com.android.tools.build:gradle' \
            android/settings.gradle android/settings.gradle.kts \
            android/build.gradle 2>/dev/null || true

      - name: Get dependencies
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Generate Launcher Icons
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter pub run flutter_launcher_icons:main || \
            echo "Launcher icons generation skipped."

      - name: Build release APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Verify APK
        run: |
          set -e
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HYBRID-PRO
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
