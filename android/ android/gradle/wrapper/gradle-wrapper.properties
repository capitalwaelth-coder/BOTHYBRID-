- name: Update Gradle Wrapper
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "Gradle wrapper not found. Checking Android project..."

            if [ ! -d android ]; then
              echo "ERROR: Android folder does not exist."
              find . -maxdepth 4 -type f \
                \( -name "gradle-wrapper.properties" -o -name "gradlew" \)
              exit 1
            fi

            if [ ! -f android/gradlew ]; then
              echo "ERROR: android/gradlew is missing."
              find android -maxdepth 5 -type f \
                \( -name "gradle-wrapper.properties" -o -name "gradlew" \)
              exit 1
            fi

            echo "ERROR: Gradle wrapper properties are missing."
            find android -maxdepth 5 -type f \
              -name "gradle-wrapper.properties"
            exit 1
          fi

          sed -i -E \
            's#gradle-[0-9][^/]*-(all|bin)\.zip#gradle-8.14.3-\1.zip#' \
            "$WRAPPER"

          echo "Updated Gradle wrapper:"
          cat "$WRAPPER"

          chmod +x android/gradlew
          android/gradlew --version
